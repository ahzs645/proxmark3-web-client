[package]
name = "proxmark3-desktop"
version = "0.1.0"
description = "Proxmark3 Desktop Client with USB and Bluetooth support"
authors = ["Ahmad Jalil"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5" }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["sync", "time"] }

# Serial port support
serialport = "4.3"

# Platform detection
[target.'cfg(target_os = "macos")'.dependencies]
# IOBluetooth bindings will be added in Phase 4
# objc2 = "0.6"
# block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# BlueZ bindings will be added in Phase 4
# bluer = { version = "0.17", features = ["rfcomm"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Bluetooth will be added in Phase 4
# windows = { version = "0.52", features = ["Win32_Devices_Bluetooth"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
